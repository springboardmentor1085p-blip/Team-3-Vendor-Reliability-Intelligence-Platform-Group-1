<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Segoe UI", Roboto, sans-serif',
  themeVariables: {
    fontSize: '16px', // Increased text size
    lineColor: '#2b6cb0', // Strong colorful blue relationship lines
    textColor: '#2d3748',
    primaryTextColor: '#1a202c',
    entityBkgColor: '#ebf8ff', // Beautiful soft blue table headers
    entityBorderColor: '#3182ce',
    attributeBackgroundColorOdd: '#ffffff', // Clean contrast attributes
    attributeBackgroundColorEven: '#f7fafc',
  },
});
const src = `erDiagram
  ROLES ||--o{ USERS : has
  USERS ||--o| VENDORS : "linked account"
  VENDOR_CATEGORIES ||--o{ VENDORS : classifies
  VENDORS ||--o{ VENDOR_CONTACTS : has
  VENDORS ||--o{ VENDOR_DOCUMENTS : has
  VENDORS ||--o{ PURCHASE_ORDERS : fulfills
  VENDORS ||--o{ VENDOR_PERFORMANCE_METRICS : "measured by"
  VENDORS ||--o{ VENDOR_RATINGS : receives
  VENDORS ||--o{ VENDOR_ISSUES : "reported for"
  VENDORS ||--|| VENDOR_RELIABILITY_SCORES : "scored as"
  VENDORS ||--o{ RELIABILITY_SCORE_HISTORY : tracks
  VENDORS ||--o{ CONTRACTS : signs
  VENDORS ||--o{ CERTIFICATIONS : holds
  VENDORS ||--o{ COMPLIANCE_RECORDS : "checked for"
  USERS ||--o{ PROCUREMENT_REQUESTS : creates
  PROCUREMENT_REQUESTS ||--o| PURCHASE_ORDERS : converts_to
  PURCHASE_ORDERS ||--o{ PURCHASE_ORDER_ITEMS : contains
  PURCHASE_ORDERS ||--o{ INVOICES : billed_by
  PURCHASE_ORDERS ||--o{ DELIVERY_TRACKING : tracked_by
  CONTRACTS ||--o{ COMPLIANCE_RECORDS : governs
  USERS ||--o{ MESSAGES : sends
  MESSAGES ||--o{ MESSAGE_ATTACHMENTS : has
  USERS ||--o{ NOTIFICATIONS : receives
  USERS ||--o{ REPORTS : generates
  USERS ||--o{ ACTIVITY_LOGS : performs

  ROLES {
    smallint role_id PK
    string role_name
  }
  USERS {
    uuid user_id PK
    smallint role_id FK
    string full_name
    string email
    string status
  }
  VENDOR_CATEGORIES {
    smallint category_id PK
    string category_name
  }
  VENDORS {
    uuid vendor_id PK
    string vendor_code
    string company_name
    smallint category_id FK
    uuid linked_user_id FK
    string status
  }
  VENDOR_CONTACTS {
    uuid contact_id PK
    uuid vendor_id FK
    string contact_name
    boolean is_primary
  }
  VENDOR_DOCUMENTS {
    uuid document_id PK
    uuid vendor_id FK
    string document_type
    date expiry_date
  }
  PROCUREMENT_REQUESTS {
    uuid request_id PK
    uuid requested_by FK
    string status
    string priority
  }
  PURCHASE_ORDERS {
    uuid po_id PK
    uuid request_id FK
    uuid vendor_id FK
    uuid created_by FK
    string status
    numeric total_amount
  }
  PURCHASE_ORDER_ITEMS {
    uuid po_item_id PK
    uuid po_id FK
    string item_name
    numeric quantity
    numeric unit_price
  }
  INVOICES {
    uuid invoice_id PK
    uuid po_id FK
    uuid vendor_id FK
    string status
    numeric amount
  }
  DELIVERY_TRACKING {
    uuid delivery_id PK
    uuid po_id FK
    string delivery_status
    date delivered_date
  }
  VENDOR_PERFORMANCE_METRICS {
    uuid metric_id PK
    uuid vendor_id FK
    uuid po_id FK
    string metric_type
    numeric metric_value
  }
  VENDOR_RATINGS {
    uuid rating_id PK
    uuid vendor_id FK
    uuid po_id FK
    numeric overall_rating
  }
  VENDOR_ISSUES {
    uuid issue_id PK
    uuid vendor_id FK
    string status
    numeric resolution_time_hours
  }
  VENDOR_RELIABILITY_SCORES {
    uuid score_id PK
    uuid vendor_id FK
    numeric overall_score
    string risk_level
  }
  RELIABILITY_SCORE_HISTORY {
    uuid history_id PK
    uuid vendor_id FK
    numeric overall_score
    timestamp calculated_at
  }
  CONTRACTS {
    uuid contract_id PK
    uuid vendor_id FK
    string status
    date end_date
  }
  CERTIFICATIONS {
    uuid certification_id PK
    uuid vendor_id FK
    date expiry_date
  }
  COMPLIANCE_RECORDS {
    uuid compliance_id PK
    uuid vendor_id FK
    uuid contract_id FK
    string status
  }
  MESSAGES {
    uuid message_id PK
    uuid sender_id FK
    uuid receiver_id FK
    uuid vendor_id FK
  }
  MESSAGE_ATTACHMENTS {
    uuid attachment_id PK
    uuid message_id FK
  }
  NOTIFICATIONS {
    uuid notification_id PK
    uuid user_id FK
    string notification_type
    boolean is_read
  }
  REPORTS {
    uuid report_id PK
    uuid generated_by FK
    string report_type
  }
  ACTIVITY_LOGS {
    bigint log_id PK
    uuid user_id FK
    string entity_type
    string action
  }
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script></body></html>
